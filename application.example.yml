# Wird im Docker-Image nach /app/config/application.yml kopiert.
# Der Datenbankzugang kommt aus Umgebungsvariablen.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:macdb}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PWD}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  #allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  #allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization}
  #allow-credentials: true
