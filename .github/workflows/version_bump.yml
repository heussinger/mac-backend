name: Bump Version
run-name: Bump Version on ${{ github.ref_name }}

# Trigger on create a branch/release or manually with a specific version bump type
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'What type of version bump to preform'
        required: true
        default: 'bugfix_release'
        type: choice
        options:
        - bugfix_release
        - minor_release
        - major_release
      version_file:
        description: 'the path of the version file'
        required: false
        type: string
        default: 'VERSION'
        
jobs:
  # Increment the VERSION file based on the selected bump type (bugfix/minor/major)
  bump_version:
    name: Bump-Version
    runs-on: ubuntu-latest
    env:
      VERSION_FILE: ${{inputs.version_file}}
      BUMP_TYPE: ${{inputs.type}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read latest version
        run: echo "VERSION=$(cat $VERSION_FILE)" >> "$GITHUB_ENV"
      - name: Generate next bugfix release version or next develop version
        if: env.BUMP_TYPE == 'bugfix_release'
        run: |
          NEW_VERSION=$(echo $VERSION | cut -d"." -f1).$(echo $VERSION | cut -d"." -f2).$(($(echo $VERSION | cut -d"." -f3) + 1))
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
      - name: bump txt version file
        run: echo "$NEW_VERSION" > "$VERSION_FILE"
      - name: make pull request
        run: echo "done"
      - name: commit version file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $VERSION_FILE
          git commit -m "Bump version to $NEW_VERSION"
          git push
      
